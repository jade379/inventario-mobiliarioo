<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Mobiliario</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="contenedor">
        <h2>📝 Nuevo Registro</h2>

        <div class="exito" style="display:none;">✅ Registro guardado correctamente</div>
        <div class="error" style="display:none;">❌ Error al guardar</div>

        <form class="formulario">
            <label>Nombre del mueble:</label>
            <input type="text" name="nombre_mueble" required placeholder="Ej: Silla, Escritorio, Pizarrón">

            <label>Cantidad:</label>
            <input type="number" name="cantidad" min="1" required placeholder="Ej: 10">

            <label>Estado:</label>
            <select name="estado" required>
                <option value="">Seleccionar...</option>
                <option value="Bueno">Bueno</option>
                <option value="Regular">Regular</option>
                <option value="Malo">Malo</option>
            </select>

            <label>Ubicación / Aula:</label>
            <input type="text" name="ubicacion" required placeholder="Ej: Aula 101, Biblioteca">

            <button type="submit" class="boton">Guardar en Inventario</button>
        </form>

        <a href="index.html" class="boton volver">🔙 Volver al menú</a>
    </div>
</body>
</html>
